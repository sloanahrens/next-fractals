name: Deploy

on:
  push:
    branches: ["*"]

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: fractals-nextjs
  PULUMI_ORG: ${{ vars.PULUMI_ORG }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Clone devops-azure-container-apps
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEVOPS_REPO }}
          path: devops
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: devops/app/package-lock.json

      - name: Install Pulumi dependencies
        working-directory: devops/app
        run: npm ci

      - name: Setup Pulumi CLI
        uses: pulumi/actions@v6

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Pulumi Login (Azure Blob)
        run: pulumi login azblob://state?storage_account=${{ env.AZURE_STORAGE_ACCOUNT }}

      - name: Normalize branch name
        id: branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          NORMALIZED=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-32)
          echo "name=$NORMALIZED" >> $GITHUB_OUTPUT
          echo "Normalized branch: $NORMALIZED"

      - name: Get ACR name from infrastructure
        id: acr
        working-directory: devops/infrastructure
        run: |
          npm ci
          ACR_NAME=$(pulumi stack output acrName -s ${{ env.PULUMI_ORG }}/infrastructure/prod --non-interactive)
          echo "name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "ACR: $ACR_NAME"

      - name: Build and push image
        run: |
          az acr login --name ${{ steps.acr.outputs.name }}
          docker build -t ${{ steps.acr.outputs.name }}.azurecr.io/${{ env.APP_NAME }}:${{ steps.branch.outputs.name }} ./app
          docker push ${{ steps.acr.outputs.name }}.azurecr.io/${{ env.APP_NAME }}:${{ steps.branch.outputs.name }}

      - name: Deploy Container App
        working-directory: devops/app
        run: |
          pulumi stack select ${{ env.PULUMI_ORG }}/app/${{ env.APP_NAME }}-${{ steps.branch.outputs.name }} --create
          pulumi config set appName ${{ env.APP_NAME }}
          pulumi config set imageTag ${{ steps.branch.outputs.name }}
          pulumi config set infraStackRef ${{ env.PULUMI_ORG }}/infrastructure/prod
          pulumi up --yes

      - name: Output URL
        id: url
        working-directory: devops/app
        run: |
          URL=$(pulumi stack output url)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**App:** ${{ env.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ steps.branch.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY

      - name: Health check
        run: |
          URL="${{ steps.url.outputs.url }}"
          echo "Checking health at ${URL}/health"
          for i in {1..6}; do
            if curl -sf "${URL}/health" > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/6 - waiting 10s..."
            sleep 10
          done
          echo "Health check failed after 60s"
          exit 1
