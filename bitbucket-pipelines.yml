image: atlassian/default-image:4

definitions:
  caches:
    docker-buildx: ~/.docker/buildx

pipelines:
  default:
    - parallel:
        - step:
            name: Build and Test Next.js App
            image: node:20-alpine
            caches:
              - node
            script:
              - npm ci
              - npm run build
              - npm run lint
              - npx tsc --noEmit