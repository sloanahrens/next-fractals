name: Cleanup

on:
  delete:

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: fractals-nextjs
  PULUMI_ORG: ${{ vars.PULUMI_ORG }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

jobs:
  cleanup:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Clone devops-azure-container-apps
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEVOPS_REPO }}
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install Pulumi dependencies
        working-directory: app
        run: npm ci

      - name: Setup Pulumi CLI
        uses: pulumi/actions@v6

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Pulumi Login (Azure Blob)
        run: pulumi login azblob://state?storage_account=${{ env.AZURE_STORAGE_ACCOUNT }}

      - name: Normalize branch name
        id: branch
        run: |
          BRANCH="${{ github.event.ref }}"
          NORMALIZED=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-32)
          echo "name=$NORMALIZED" >> $GITHUB_OUTPUT
          echo "Cleaning up branch: $BRANCH (normalized: $NORMALIZED)"

      - name: Destroy Container App
        working-directory: app
        run: |
          STACK="${{ env.PULUMI_ORG }}/app/${{ env.APP_NAME }}-${{ steps.branch.outputs.name }}"
          echo "Attempting to destroy stack: $STACK"

          if pulumi stack select "$STACK" 2>/dev/null; then
            echo "Stack found, destroying..."
            pulumi destroy --yes
            pulumi stack rm --yes
            echo "Stack destroyed and removed"
          else
            echo "Stack not found, nothing to clean up"
          fi
