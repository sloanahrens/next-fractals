# Bitbucket Pipeline for Next Fractals
# Deploys all branches after tests pass
# Required repository variables:
#   - GCP_SERVICE_ACCOUNT_KEY: Base64-encoded service account JSON key
#   - GCP_PROJECT: Your GCP project ID
#   - GCP_REGION: GCP region (e.g., us-central1)
#
# Infrastructure Notes:
#   - Shared Artifact Registry repository: 'next-fractals-docker' (created only on master branch)
#   - Branch-specific Cloud Run services: 'next-fractals-{branch-name}'

image: atlassian/default-image:4

definitions:
  caches:
    docker-buildx: ~/.docker/buildx

pipelines:
  default:
    - parallel:
        - step:
            name: Build and Test Next.js App
            image: node:20-alpine
            caches:
              - node
            script:
              - npm ci
              - npm run build
              - npm run lint
              - npx tsc --noEmit

        - step:
            name: Build and Push Container Image
            services:
              - docker
            caches:
              - docker
            script:
              # Build Next.js container
              - echo "Building Next.js application container..."
              - docker build --platform linux/amd64 -t next-fractals:test -f Dockerfile .
              - echo "Next.js container built successfully"

              # Check environment variables
              - |
                if [ -z "$GCP_SERVICE_ACCOUNT_KEY" ] || [ -z "$GCP_PROJECT" ]; then
                  echo "❌ ERROR: Required repository variables not set"
                  echo "Configure GCP_SERVICE_ACCOUNT_KEY and GCP_PROJECT in Repository settings"
                  exit 1
                fi
                [ -z "$GCP_REGION" ] && export GCP_REGION="us-central1"
              - |
                BRANCH_NAME=$(echo "$BITBUCKET_BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
                echo "Deploying branch: $BITBUCKET_BRANCH as: $BRANCH_NAME"

              - echo $GCP_SERVICE_ACCOUNT_KEY | base64 -d > /tmp/gcp-key.json
              - cat /tmp/gcp-key.json | docker login -u _json_key --password-stdin https://$GCP_REGION-docker.pkg.dev

              # Build and push image with branch-specific tag
              - |
                SHARED_DOCKER_REPO="next-fractals-docker"
                IMAGE_URL="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$SHARED_DOCKER_REPO/next-fractals-$BRANCH_NAME:$BITBUCKET_COMMIT"
                echo "Building and pushing image: $IMAGE_URL"

              - docker build --platform linux/amd64 -t $IMAGE_URL -f Dockerfile .
              - docker push $IMAGE_URL

              # # Deploy with Terraform (with debug mode enabled)
